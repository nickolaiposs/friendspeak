# Checks for `dev` and pull requests. There's no test suite (AGENTS.md →
# Verifying changes), so this catches syntax errors, a broken game build and a
# media sidecar that doesn't compile, and makes sure a PR into `prod` is releasable.
name: CI

on:
  push:
    branches: [dev]
  pull_request:

# Actions are pinned to a commit (the tag is in the comment): a tag can be moved, a commit can't.
# To update one: `gh api repos/<owner>/<action>/commits/<tag> --jq .sha`.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: |
          for f in server.js updater.js admin.js logbuffer.js persist.js game/index.js desktop/*.js scripts/*.js docker/*.js; do node --check "$f"; done
          for f in public/js/*.js admin-ui/js/*.js admin-ui/js/views/*.js; do node --check --input-type=module < "$f" || { echo "in $f"; exit 1; }; done
      - name: Deploy stack
        run: |
          bash -n deploy/install.sh
          DOMAIN=chat.example.com docker compose -f deploy/docker-compose.yaml config -q
          docker run --rm -e DOMAIN=chat.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: Server starts
        run: |
          DATA_DIR="$RUNNER_TEMP/data" GAME=off PORT=3999 node server.js &
          for i in $(seq 30); do curl -sf localhost:3999/api/info && exit 0; sleep 1; done
          exit 1
      - run: npm run build:game

  # The native media sidecar (native/, Rust): it must build on every OS it ships for
  media:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AWS_LC_SYS_PREBUILT_NASM: 1 # Windows: the crypto library's assembly, without installing NASM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: media-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}
      # The compiler native/rust-toolchain.toml pins
      - working-directory: native
        run: rustup toolchain install
      - working-directory: native
        run: cargo build --release --locked
      - name: It runs
        working-directory: native
        run: cargo run --release --locked -- --version
      # native/.cargo/config.toml asks for Control Flow Guard: the program must carry its table
      - name: Control Flow Guard is on
        if: runner.os == 'Windows'
        working-directory: native
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          $line = & $dumpbin.FullName /loadconfig target\release\friendspeak-media.exe | Select-String 'Guard CF function count'
          "$line"
          if (-not $line -or "$line" -match '^\s*0+\s') { throw 'Control Flow Guard is not on in friendspeak-media.exe' }

  # A merge into prod releases package.json's version, so it must be new and have notes
  releasable:
    if: github.event_name == 'pull_request' && github.base_ref == 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          node scripts/release-notes.js "$V" > /dev/null
          if [ "$(gh release view "v$V" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::v$V is already released. Bump \"version\" in package.json."
            exit 1
          fi
