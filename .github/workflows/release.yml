# Every push to `prod` releases the version in package.json (D29):
#   1. a draft GitHub Release v<version> with the CHANGELOG.md section as notes
#   2. desktop installers for macOS, Windows and Linux uploaded to it, with the
#      latest*.yml files the app's updater reads. Each is built on its own OS,
#      with the native media sidecar for that OS inside (scripts/build-media.js)
#   3. the server image ghcr.io/<repo>:<version> (amd64 + arm64)
#   4. once everything built: the release is published and the image tagged
#      :latest. Only then do apps and servers see the update.
# A version that is already released fails step 1: bump package.json first.
name: Release

on:
  push:
    branches: [prod]
  workflow_dispatch: # re-run by hand, e.g. after a flaky build

concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default: each job asks for what it needs. Actions are pinned to a commit (the tag is in
# the comment), and checkout doesn't leave the token behind for the build steps that follow it:
# what this workflow publishes is installed by every app and pulled by every auto-updating server.
permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  NODE_VERSION: 24

jobs:
  prepare:
    permissions:
      contents: write # create the draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-notes.js "$V" > notes.md
          draft=$(gh release view "v$V" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "::error::v$V is already released. Bump \"version\" in package.json and add a CHANGELOG.md section."
            exit 1
          fi
          # A draft left by a failed run: start over
          if [ "$draft" = "true" ]; then gh release delete "v$V" --yes; fi
          gh release create "v$V" --draft --target "$GITHUB_SHA" --title "friendspeak $V" --notes-file notes.md

  desktop:
    permissions:
      contents: write # upload the installers to the draft release
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # --ignore-scripts: the installers don't include the game, so skip its build
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The native media sidecar (D45), built on the OS it is for; on macOS for both chips. Linux has none yet.
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build the media sidecar
        run: node scripts/build-media.js
        env:
          AWS_LC_SYS_PREBUILT_NASM: 1 # Windows: the crypto library's assembly, without installing NASM
      - name: Build and upload installers
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ github.token }}
          # Unsigned (ad-hoc on macOS) until there's an Apple Developer ID (D21)
          CSC_IDENTITY_AUTO_DISCOVERY: false

  docker:
    permissions:
      contents: read
      packages: write # push to ghcr.io
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    permissions:
      contents: write # publish the release
      packages: write # tag the image as latest
    needs: [prepare, desktop, docker]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the image as latest
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$V"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$V" --repo "${{ github.repository }}" --draft=false --latest
